# Images are referenced by an explicit tag or digest, never `latest`.
#
# `latest` (or no tag, which means latest) is a moving target: two pods of one Deployment can
# run different code, and a rollback has nothing to roll back to. CI tags images with the
# commit SHA.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions: [Deny]
  # Also check the pod template inside Deployments, Jobs ...: the author sees the rejection on
  # the resource they applied, not later on a pod that silently never appears.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        # Workload namespaces only. Platform namespaces must keep working even when a policy
        # is wrong, and their charts are not ours to rewrite.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, default, argocd, kyverno, external-secrets, db-operator, monitoring]
  validations:
    - expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
          c.image.contains('@sha256:') ||
          (c.image.lastIndexOf(':') > c.image.lastIndexOf('/') && !c.image.endsWith(':latest')))
      message: "Image references need an explicit tag other than 'latest', or a digest."
