# Deployments define readiness and liveness probes.
#
# Without a readiness probe Kubernetes sends traffic to a pod the moment its process starts,
# and a rolling update "succeeds" with pods that cannot serve. Without a liveness probe a
# hung process is never restarted. Jobs are exempt: they end, they do not serve.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
    namespaceSelector:
      matchExpressions:
        # Workload namespaces only. Platform namespaces must keep working even when a policy
        # is wrong, and their charts are not ours to rewrite.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, default, argocd, kyverno, external-secrets, db-operator, monitoring]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c, has(c.readinessProbe) && has(c.livenessProbe))
      message: "Every container of a Deployment needs a readinessProbe and a livenessProbe."
