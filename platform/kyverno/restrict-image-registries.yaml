# Workloads run images from this account's ECR only.
#
# An image from a public registry has not passed our CI: no tests, no vulnerability scan,
# no provenance. Everything that runs here is built by our pipelines and stored in our ECR.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions: [Deny]
  # Also check the pod template inside Deployments, Jobs ...: the author sees the rejection on
  # the resource they applied, not later on a pod that silently never appears.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        # Workload namespaces only. Platform namespaces must keep working even when a policy
        # is wrong, and their charts are not ours to rewrite.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, default, argocd, kyverno, external-secrets, db-operator, monitoring]
  validations:
    - expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
          c.image.startsWith('693906847772.dkr.ecr.ap-south-1.amazonaws.com/'))
      message: "Images must come from 693906847772.dkr.ecr.ap-south-1.amazonaws.com (built and scanned by CI)."
