apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-image-updater-controller
          env:
            # Commit through the GitHub API as the App: authored by idp-ci-bot[bot] and signed
            # by GitHub ("Verified"), with no signing key to manage.
            - name: GIT_COMMIT_METHOD
              value: api
          # Upstream asks for 250m / 512Mi; that is a quarter of a t4g.small for one small
          # controller watching a handful of images.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: ecr-login
              mountPath: /app/scripts
              readOnly: true
      volumes:
        - name: ecr-login
          configMap:
            name: image-updater-ecr-login
            defaultMode: 0555
