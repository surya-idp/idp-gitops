# GitHub App "idp-ci-bot" credentials for the tag commits to this repo. The App is installed
# on idp-gitops only and is on the main ruleset's bypass list, so it can commit tag bumps
# directly. This is the only copy of the key in the cluster; service repos hold no credential
# that can write here.
# Source: idp/ci-bot-github-app, loaded from ~/.idp by `make up` each session.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-updater-git
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: image-updater-git
    creationPolicy: Owner
  data:
    - secretKey: githubAppID
      remoteRef: {key: idp/ci-bot-github-app, property: appId}
    - secretKey: githubAppInstallationID
      remoteRef: {key: idp/ci-bot-github-app, property: installationId}
    - secretKey: githubAppPrivateKey
      remoteRef: {key: idp/ci-bot-github-app, property: privateKey}
