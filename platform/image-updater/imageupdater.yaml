# One ImageUpdater for every golden-path Application. The per-service settings (which image,
# where to write) are annotations that the ApplicationSet puts on each Application
# (platform/argocd-apps/golden-path-services.yaml); useAnnotations is the upstream-documented
# way to drive ApplicationSet-generated apps without one ImageUpdater per service.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: golden-path
  annotations:
    # The CRD is created in the same sync; skip the dry run until it exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  applicationRefs:
    - namePattern: "*"
      labelSelectors:
        matchLabels:
          idp.surya-idp/golden-path: "true"
      useAnnotations: true
---
# The platform's own two apps (flag API, Backstage). Until 2026-10 their CI committed the new
# tag here itself, which needed the idp-ci-bot key in both app repos and once committed tags
# out of order after quick merges. Now they are handled like every other service: CI pushes
# an image, this controller commits the tag. The bot key exists in one place, the cluster.
#
# Listed by name, not by label: they are plain Applications (platform/argocd-apps), not
# generated by the ApplicationSet. Their settings are the same annotations, on each
# Application. Two ImageUpdaters must never match the same Application (upstream:
# "Multiple ImageUpdater Resources Conflict"); the one above matches only the golden-path label.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: platform-apps
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  applicationRefs:
    - namePattern: feature-flag-dev
      useAnnotations: true
    - namePattern: idp-portal
      useAnnotations: true
