# The webhook receiver Alertmanager sends to (see receiver.py, mounted from a ConfigMap).
# A stock Python image with a 40-line script: no image of ours to build for a test endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  labels:
    app.kubernetes.io/name: alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-receiver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          command: ["python", "/app/receiver.py"]
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: alert-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
spec:
  selector:
    app.kubernetes.io/name: alert-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
