# Grafana's admin login. The password is generated by Terraform for each session
# (idp-infra/20-data, random_password.grafana) and never written anywhere else.
# To log in:
#   kubectl -n monitoring port-forward svc/kps-grafana 3000:80        -> http://localhost:3000
#   user admin, password:
#   kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef: {key: idp/grafana-admin, property: admin-user}
    - secretKey: admin-password
      remoteRef: {key: idp/grafana-admin, property: admin-password}
