# =============================================================================
# ClusterSecretStore — aws-secrets-manager
#
# Cluster-scoped store: any namespace can create ExternalSecrets referencing
# this store without needing per-namespace SecretStore resources.
#
# AUTH: IRSA via the external-secrets ServiceAccount annotation.
#   The idp-eso IAM role (created in 30-cluster) allows:
#     secretsmanager:GetSecretValue + DescribeSecret on idp/* only.
#   The OIDC trust policy is scoped to:
#     system:serviceaccount:external-secrets:external-secrets
#
# REGION: ap-south-1 — must match where Secrets Manager secrets live.
#
# After Step 27 env-config restructure, this file moves to:
#   platform/eso/cluster-secret-store.yaml
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
