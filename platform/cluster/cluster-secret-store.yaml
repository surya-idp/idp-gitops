# =============================================================================
# ClusterSecretStore — aws-secrets-manager
#
# Cluster-scoped store: any namespace can create ExternalSecrets referencing this store
# without needing per-namespace SecretStore resources.
#
# AUTH: none written here. The External Secrets controller's pod gets the IAM role idp-eso
#   through EKS Pod Identity (association in idp-infra/30-cluster), and the store uses the
#   controller's own credentials. The role allows GetSecretValue + DescribeSecret on idp/* only.
#   (Until 2026-10-10 this file named a ServiceAccount to exchange a token for the role: IRSA.)
#
# REGION: ap-south-1 — must match where Secrets Manager secrets live.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
