# Lets the flag API ask Kubernetes "is this ServiceAccount token genuine, and whose is it?".
#
# system:auth-delegator is a role that ships with Kubernetes for exactly this: it allows
# creating TokenReviews (and SubjectAccessReviews) and nothing else. It cannot read Secrets,
# pods or anything about workloads. Cluster-wide by nature (a TokenReview is not in a
# namespace), so it lives here with the platform, not in the app's own folder: project `apps`
# may not create cluster-wide bindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: feature-flag-api-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: feature-flag-api
    namespace: feature-flag-dev
