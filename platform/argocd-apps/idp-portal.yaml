# App-of-apps child: Backstage (idp-portal). Wave 1, after platform-cluster (the
# ClusterSecretStore its ExternalSecret needs). Automated like feature-flag-dev.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-portal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Argo CD Image Updater (platform/image-updater, ImageUpdater `platform-apps`): the newest
    # image in ECR whose tag is a commit SHA is committed to this app's kustomization.yaml by
    # idp-ci-bot. CI of the app repo only pushes the image; it scans it before pushing.
    argocd-image-updater.argoproj.io/image-list: 'app=693906847772.dkr.ecr.ap-south-1.amazonaws.com/idp-portal'
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/app.allow-tags: 'regexp:^[0-9a-f]{40}$'
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/image-updater-git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://github.com/surya-idp/idp-gitops
    targetRevision: HEAD
    path: apps/idp-portal/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Pod Security Admission (PLATFORM_REVIEW F5): enforce baseline now, report restricted
        # violations (warn on apply, audit log) before tightening enforce to restricted.
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
