# App-of-apps child: Backstage (idp-portal). Wave 1, after platform-cluster (the
# ClusterSecretStore its ExternalSecret needs). Automated like feature-flag-dev.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-portal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://github.com/surya-idp/idp-gitops
    targetRevision: HEAD
    path: apps/idp-portal/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Pod Security Admission (PLATFORM_REVIEW F5): enforce baseline now, report restricted
        # violations (warn on apply, audit log) before tightening enforce to restricted.
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
