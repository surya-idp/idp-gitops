# App-of-apps child: feature-flag-service, dev environment.
# Automated sync: any commit to overlays/dev (CI bumps newTag) deploys with no human step.
# Wave 1: after platform-cluster (the ClusterSecretStore) is Healthy.
#
# staging/prod have overlays but no Application yet (see their kustomization.yaml).
# When added: staging = automated like this; prod = omit `automated` (manual sync).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feature-flag-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Argo CD Image Updater (platform/image-updater, ImageUpdater `platform-apps`): the newest
    # image in ECR whose tag is a commit SHA is committed to this app's kustomization.yaml by
    # idp-ci-bot. CI of the app repo only pushes the image; it scans it before pushing.
    argocd-image-updater.argoproj.io/image-list: 'app=693906847772.dkr.ecr.ap-south-1.amazonaws.com/feature-flag-service'
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/app.allow-tags: 'regexp:^[0-9a-f]{40}$'
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/image-updater-git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # make down: deleting the app removes the Ingress -> ALB
spec:
  project: apps
  source:
    repoURL: https://github.com/surya-idp/idp-gitops
    targetRevision: HEAD
    path: apps/feature-flag-service/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: feature-flag-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No ServerSideApply here: Argo CD v2.13's embedded schema predates Kubernetes 1.33's
    # Deployment .status.terminatingReplicas, so the server-side (structured merge) diff
    # fails with "field not declared in schema" and auto-sync silently stops.
    # Client-side apply has no such dependency. Upgrading Argo CD removes the need for this.
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Pod Security Admission (PLATFORM_REVIEW F5): enforce baseline now, report restricted
        # violations (warn on apply, audit log) before tightening enforce to restricted.
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
        app.kubernetes.io/part-of: feature-flag-service
        environment: dev
        # ALB controller injects a readiness gate into pods in this namespace: a pod is
        # only Ready once its ALB target is healthy. Needed for zero-downtime rollouts.
        # Must exist before pods are created (the webhook acts at pod creation).
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
