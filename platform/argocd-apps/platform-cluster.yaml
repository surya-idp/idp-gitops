# App-of-apps child: cluster-wide platform config (ClusterSecretStore).
# Wave 0: environments need the store before their ExternalSecrets can sync.
# The root Application only waits for this to be Healthy because 40-platform
# configures an Application health check in argocd-cm (off by default in Argo CD).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the app deletes its resources
spec:
  project: platform
  source:
    repoURL: https://github.com/surya-idp/idp-gitops
    targetRevision: HEAD
    path: platform/cluster
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
