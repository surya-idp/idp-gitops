# RDS master credentials for the database operator, and for nothing else. Before this, every
# app's namespace had an ExternalSecret for idp/db-creds, so every app could read the master
# password. Now only this namespace can.
# The operator reads its settings as environment variables with these exact names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-operator-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-operator-credentials
    creationPolicy: Owner
    template:
      data:
        POSTGRES_HOST: "{{ .host }}:{{ .port }}"
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASS: "{{ .password }}"
        # RDS refuses unencrypted connections (rds.force_ssl).
        POSTGRES_URI_ARGS: sslmode=require
        # On RDS the master user is not a superuser; this makes the operator grant itself
        # each role before changing a database's owner.
        POSTGRES_CLOUD_PROVIDER: AWS
        POSTGRES_DEFAULT_DATABASE: postgres
  data:
    - secretKey: host
      remoteRef: {key: idp/db-creds, property: host}
    - secretKey: port
      remoteRef: {key: idp/db-creds, property: port}
    - secretKey: username
      remoteRef: {key: idp/db-creds, property: username}
    - secretKey: password
      remoteRef: {key: idp/db-creds, property: password}
