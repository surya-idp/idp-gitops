# TEST FIXTURE, never deployed (the ApplicationSet only looks under apps/). A copy of what the
# Backstage python-service template writes, so that scripts/validate.sh checks every change to
# components/ against a service even when apps/ holds none.
#
# The files here hold only what is specific to this service. The platform's standard settings
# (rollout, pod security, probes, spreading, autoscaling metric) come from the components
# below and are maintained centrally in components/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
components:
  - ../../../components/golden-path
  - ../../../components/public-route
labels:
  # On every resource, pod template and selector.
  - pairs:
      app.kubernetes.io/name: sample-service
    includeSelectors: true
  # How Backstage finds this service's pods (catalog annotation backstage.io/kubernetes-id).
  - pairs:
      backstage.io/kubernetes-id: sample-service
    includeTemplates: true
