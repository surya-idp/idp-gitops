# Which path goes to this service. How it is exposed comes from components/public-route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-db-service
spec:
  rules:
    - http:
        paths:
          - path: /sample-db-service
            pathType: Prefix
            backend:
              service:
                name: sample-db-service
                port:
                  name: http
