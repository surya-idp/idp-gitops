# staging: DEFINED BUT NOT DEPLOYED. No Argo CD Application points here yet.
#
# Deploying it for real needs, beyond enabling an Application:
#   - its own database (base/database.yaml names one database, feature_flags: patch it per environment)
#   - a distinct Ingress rule: all envs join ALB group "idp" with path "/", which
#     would collide. Needs a host rule (domain + ACM, deferred) or listener-port split.
#   - more node capacity (2x t4g.small is sized for dev only)
# Promotion model: dev auto-syncs; staging gets a new tag only via a promotion PR that
# copies dev's newTag here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: feature-flag-staging
resources:
  - ../../base
labels:
  - pairs:
      environment: staging
    includeSelectors: false
# Replica count is owned by the HPA; overlays set its bounds.
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: feature-flag-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
images:
  - name: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/feature-flag-service
    newTag: d3da9d11272d14571403cf79861f547d1079d372
