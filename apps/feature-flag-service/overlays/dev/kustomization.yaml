# dev: the only environment deployed today. Automated sync (any merge to main deploys).
# Argo CD Image Updater rewrites newTag below when a newer image appears in ECR; the images
# entry covers both the Deployment and the migration Job (same image name).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: feature-flag-dev
resources:
  - ../../base
labels:
  - pairs:
      environment: dev
    includeSelectors: false
# Replica count is owned by the HPA; overlays set its bounds.
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: feature-flag-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
images:
  - name: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/feature-flag-service
    newTag: 4153365a5c3d575d7a0039ae7a588d666e8f0bff
