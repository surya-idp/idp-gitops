# =============================================================================
# Deployment: feature-flag-api (EKS / feature-flag-dev)
#
# KEY CHANGES FROM KIND VERSION:
#   - namespace: feature-flag-dev (not feature-flag)
#   - image: ECR (not GHCR) — no imagePullSecrets needed (node IAM role allows ECR pull)
#   - REDIS_URL: ElastiCache Valkey endpoint, synced by ESO from idp/valkey
#   - DATABASE_URL + JWT_SECRET_KEY: from ESO-synced K8s Secret (not imperative secret)
#   - No imagePullSecrets block — EKS nodes have AmazonEC2ContainerRegistryReadOnly
#     attached, so they can pull from ECR in the same account without extra credentials.
#
# LATENCY A/B NOTE (Step 16 finding):
#   p95 was ~0.97s against Neon (WAN + TLS + pooler hop).
#   This deployment uses RDS in the same VPC — same code, one variable changed.
#   Measure p95 from Prometheus after this deploys. If it collapses to <10ms,
#   WAN RTT was the root cause. If it stays high, it's SQLAlchemy pool handling.
#
# IMAGE SHA: Updated automatically by CI (GitHub App bot commit to this repo).
#   The placeholder below is replaced within ~5 min of each push to main.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flag-api
  labels:
    app: feature-flag-api
    app.kubernetes.io/part-of: feature-flag-service
    environment: dev
  annotations:
    # Wave 2: start only after the migration Job (wave 1) has created the schema.
    argocd.argoproj.io/sync-wave: "2"
spec:
  # No `replicas` here: the HorizontalPodAutoscaler (hpa.yaml) owns the count. A value
  # in Git would make Argo CD selfHeal fight the HPA on every scale event.
  #
  # ZERO-DOWNTIME ROLLOUT (Step 28) - four pieces that only work together:
  #   1. maxUnavailable 0: a new pod must be Ready before an old one is removed.
  #   2. ALB pod readiness gate (namespace label, set by the Argo Application): "Ready"
  #      also requires the ALB to report the new pod's target healthy, so traffic can
  #      actually reach it before the old pod goes.
  #   3. preStop sleep 20s > ALB deregistration delay (10s, ingress.yaml): the old pod
  #      keeps serving while the ALB drains it, instead of refusing in-flight requests.
  #   4. PodDisruptionBudget (pdb.yaml): node drains cannot take all replicas at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: feature-flag-api
  template:
    metadata:
      labels:
        app: feature-flag-api
        app.kubernetes.io/part-of: feature-flag-service
        # Prometheus scrapes /metrics on port `http` (platform/monitoring/podmonitor.yaml).
        idp.surya-idp/metrics: "true"
    spec:
      # Its token is used for TokenReview only (serviceaccount.yaml).
      serviceAccountName: feature-flag-api
      terminationGracePeriodSeconds: 40   # preStop 20s + uvicorn graceful shutdown
      # platform/cluster/priorityclasses.yaml: preempted after non-critical platform pods.
      priorityClassName: business-critical
      # Replicas in different AZs (= different nodes here), so one node or zone loss
      # never takes every replica. ScheduleAnyway: during a drain on a 2-node cluster a
      # replacement must still be allowed onto the remaining node rather than stay Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: feature-flag-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 999     # appuser from Dockerfile non-root hardening (Step 8)

      containers:
        - name: api
          # ECR image — SHA updated by CI bot after each push to main.
          # No imagePullSecrets: EKS node IAM role (AmazonEC2ContainerRegistryReadOnly)
          # grants pull access automatically. Never use :latest.
          image: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/feature-flag-service:d3da9d11272d14571403cf79861f547d1079d372
          imagePullPolicy: Always

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          ports:
            - containerPort: 8000
              name: http

          lifecycle:
            preStop:
              exec:
                command: ["sleep", "20"]

          # DATABASE_URL and JWT_SECRET_KEY from ESO-synced Secret.
          # No kind:Secret in Git — structurally eliminates the Step 13 GitOps trap.
          envFrom:
            - secretRef:
                name: feature-flag-secrets
            # Its own database login, created by the database operator (database.yaml).
            - secretRef:
                name: feature-flag-db-credentials

          env:
            - name: JWT_ALGORITHM
              value: "HS256"
            - name: JWT_EXPIRE_MINUTES
              value: "30"
            - name: CACHE_TTL_SECONDS
              value: "10"
            # Callers inside the cluster authenticate with their Kubernetes ServiceAccount token
            # (feature-flag-service app/kube_identity.py). Any ServiceAccount may read and
            # evaluate flags; only the ones listed here may create or change them. Backstage
            # is listed because its "Add a feature flag" template creates flags.
            - name: KUBE_ADMIN_SERVICEACCOUNTS
              value: system:serviceaccount:backstage:idp-portal
            # REDIS_URL comes from the ESO-synced Secret (envFrom above): the Valkey
            # endpoint hash changes every time the cluster layer is recreated.

          # Readiness: strict — 3 failures → stop routing traffic here
          # /health returns 503 when DB is unreachable (Step 2)
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # Liveness: lenient — 5 failures → restart pod
          # More lenient than readiness: DB outage shouldn't cause restart storm
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
