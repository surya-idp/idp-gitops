# =============================================================================
# ExternalSecret: feature-flag-secrets (feature-flag-dev namespace)
#
# ESO reads 2 secrets from AWS Secrets Manager and writes a single
# Kubernetes Secret named "feature-flag-secrets" in the feature-flag-dev
# namespace. The app reads DATABASE_URL and JWT_SECRET_KEY from this secret.
#
# SECRET LAYOUT IN SECRETS MANAGER:
#   idp/db-creds    → { "password": "...", "url": "postgresql://..." }
#   idp/jwt-secret  → { "JWT_SECRET_KEY": "..." }
#   idp/valkey      → { "url": "redis://<valkey-endpoint>:6379" }  (written by 30-cluster)
#
# REFRESH INTERVAL: 1h — ESO re-reads Secrets Manager every hour.
#   If a secret is rotated, the K8s secret updates within 1 hour.
#   Pods pick up the new value on next restart (no live reload in this setup).
#
# SECURITY: No kind:Secret exists in Git — this is the fix for the
#   secret-template GitOps trap found in Step 13.
#   ESO creates the K8s Secret at runtime; it never touches Git.
#
# After Step 27: moves to apps/feature-flag-service/base/externalsecret.yaml
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: feature-flag-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: feature-flag-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: idp/db-creds
        property: url
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: idp/jwt-secret
        property: JWT_SECRET_KEY
    # Valkey endpoint changes every session (random hash in the hostname), so it is
    # published to Secrets Manager by 30-cluster instead of hardcoded in the Deployment.
    - secretKey: REDIS_URL
      remoteRef:
        key: idp/valkey
        property: url
