# Base for feature-flag-service: everything an environment needs, with no namespace,
# replica count or image tag decided here. Overlays (dev/staging/prod) own those.
#
# Sync order inside an environment (Argo CD sync waves, set on the resources):
#   wave 0  ExternalSecret, Service, Ingress   (ESO creates feature-flag-secrets)
#   wave 1  migrate-job.yaml                   (Sync hook: alembic upgrade head)
#   wave 2  deployment.yaml                    (starts only once the schema exists)
#   wave 3  hpa.yaml, pdb.yaml                 (need the Deployment to exist to be Healthy)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - database.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
# The platform-wide service label (policy require-labels; also used by Backstage, dashboards
# and NetworkPolicy). Added to resources and pod templates only: selectors are immutable, and
# changing them would force the Deployment to be recreated.
labels:
  - pairs:
      app.kubernetes.io/name: feature-flag-service
    includeTemplates: true
    includeSelectors: false
