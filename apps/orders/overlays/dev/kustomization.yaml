# First deploy is pinned to the repo's initial commit, which that repo's CI builds and pushes.
# After that, Argo CD Image Updater rewrites newTag on every new image (commits by idp-ci-bot).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - ../../base
images:
  - name: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/svc/orders
    newTag: f74d8fb81e20224df91eb44218d10c59f6623bdf
