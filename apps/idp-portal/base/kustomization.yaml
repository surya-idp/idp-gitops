# Backstage (idp-portal). Image built by github.com/surya-idp/idp-portal CI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - database.yaml
  - externalsecret-github.yaml
  - deployment.yaml
  - service.yaml
# The platform-wide service label (policy require-labels; also used by Backstage, dashboards
# and NetworkPolicy). Added to resources and pod templates only: selectors are immutable, and
# changing them would force the Deployment to be recreated.
labels:
  - pairs:
      app.kubernetes.io/name: idp-portal
    includeTemplates: true
    includeSelectors: false
