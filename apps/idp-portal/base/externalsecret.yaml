# Backstage connects to the same RDS instance as the API, with the master user from
# idp/db-creds. Backstage creates its own databases (backstage_plugin_*) on first
# start, so nothing needs to be created by hand. SSL is configured in the image
# (app-config.production.yaml + bundled RDS CA).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idp-portal-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: idp-portal-db
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_HOST
      remoteRef: {key: idp/db-creds, property: host}
    - secretKey: POSTGRES_PORT
      remoteRef: {key: idp/db-creds, property: port}
    - secretKey: POSTGRES_USER
      remoteRef: {key: idp/db-creds, property: username}
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: idp/db-creds, property: password}
