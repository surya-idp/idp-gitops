# Backstage's own identity. Through IRSA it becomes the IAM role idp-portal, which may only
# delete ECR repositories under svc/* (used by the decommission-service template).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idp-portal
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::693906847772:role/idp-portal
