# Strategic merge patch for every golden-path Deployment (the name below is ignored: the
# component targets by kind).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # No replicas: the HorizontalPodAutoscaler owns the count.
  #
  # ZERO-DOWNTIME ROLLOUT (Step 28) - four pieces that only work together:
  #   1. maxUnavailable 0: a new pod must be Ready before an old one is removed.
  #   2. ALB pod readiness gate (namespace label, set by the ApplicationSet): "Ready" also
  #      requires the ALB to report the new pod's target healthy.
  #   3. preStop sleep 20s > ALB deregistration delay (10s, components/public-route): the old
  #      pod keeps serving while the ALB drains it.
  #   4. PodDisruptionBudget (pdb.yaml): node drains cannot take all replicas at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        # Opt in to metrics scraping: Prometheus scrapes every pod with this label on its
        # port `http`, path /metrics (platform/monitoring/podmonitor.yaml).
        idp.surya-idp/metrics: "true"
    spec:
      terminationGracePeriodSeconds: 40   # preStop 20s + graceful shutdown
      priorityClassName: business-critical
      # The service's own ServiceAccount exists for identity (IRSA later); the app does not
      # call the Kubernetes API, so no token is mounted.
      automountServiceAccountToken: false
      # Pod Security "restricted" profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Replicas in different zones (= different nodes here). ScheduleAnyway: during a drain
      # on a 2-node cluster a replacement must still be allowed onto the remaining node.
      # The selector is filled in by the service's `labels` (app.kubernetes.io/name).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {}
      containers:
        - name: app
          env:
            # Where to send traces (Tempo, platform/argocd-apps/monitoring-traces.yaml). The
            # skeleton turns tracing on only when this is set, so the same image runs
            # unchanged on a laptop.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc:4318
            # The name traces are filed under: the service label of the pod.
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "20"]
          # startup: up to 60s to come up, without loosening the two probes below.
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # ready: strict. 3 failures take the pod out of the Service and the ALB.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          # live: lenient, and it checks no dependency: an outage elsewhere must not
          # restart every pod.
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The only writable path (the root filesystem is read-only).
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
